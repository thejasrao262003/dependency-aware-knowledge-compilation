name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Tests (unit, integration, regression, concurrency, drift, provenance, benchmark properties)
        run: uv run pytest
      - name: Benchmark reproduces published results (100 docs, every non-timing metric)
        run: uv run python -m benchmarks.run --sizes 100 --reps 1 --verify-against benchmarks/results/latest.json --work /tmp/bench-work
      - name: Claim-equivalence evaluation (deterministic matchers)
        run: uv run python -m benchmarks.equivalence --out /tmp/equivalence.json
      - name: Example corpus end to end
        run: |
          mkdir -p /tmp/demo && cp -r examples/sample-knowledge-base /tmp/demo/knowledge
          cd /tmp/demo
          uv run --project "$GITHUB_WORKSPACE" dakc ingest ./knowledge
          uv run --project "$GITHUB_WORKSPACE" dakc trace page:postgresql > /dev/null
          uv run --project "$GITHUB_WORKSPACE" dakc verify --against-full
