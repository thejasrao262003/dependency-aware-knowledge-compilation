name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Pinned to commit SHAs (supply-chain safety); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install (locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Tests (unit, integration, regression, concurrency, drift, provenance, benchmark properties)
        run: uv run pytest
      - name: Benchmark reproduces published results (100 docs, every non-timing metric)
        run: uv run python -m benchmarks.run --sizes 100 --reps 1 --verify-against benchmarks/results/latest.json --work /tmp/bench-work
      - name: Claim-equivalence evaluation (deterministic matchers)
        run: uv run python -m benchmarks.equivalence --out /tmp/equivalence.json
      - name: MkDocs integration example (strict build; the second build must be a no-op)
        run: |
          cd examples/mkdocs-site
          uv run --project "$GITHUB_WORKSPACE" mkdocs build --strict
          uv run --project "$GITHUB_WORKSPACE" mkdocs build --strict 2>&1 | tee /tmp/second-build.log
          grep -q "knowledge base up to date" /tmp/second-build.log
      - name: Example corpus end to end
        run: |
          mkdir -p /tmp/demo && cp -r examples/sample-knowledge-base /tmp/demo/knowledge
          cd /tmp/demo
          uv run --project "$GITHUB_WORKSPACE" dakc ingest ./knowledge
          uv run --project "$GITHUB_WORKSPACE" dakc trace page:postgresql > /dev/null
          uv run --project "$GITHUB_WORKSPACE" dakc verify --against-full
