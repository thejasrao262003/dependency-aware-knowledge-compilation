# An ordinary MkDocs site; the only DAKC-specific line is `- dakc` under plugins.
# Build it:  cd examples/mkdocs-site && mkdocs build   (or `mkdocs serve`, then edit a doc and watch the log)
site_name: Halcyon engineering docs (DAKC example)
docs_dir: ../sample-knowledge-base
nav:
  - Databases:
      - PostgreSQL: databases/postgresql.md
      - Redis: databases/redis.md
  - Messaging:
      - Kafka: messaging/kafka.md
  - Platform:
      - Runbook: platform/runbook.md
  - Knowledge (generated by DAKC): knowledge/index.md
plugins:
  - search
  - dakc
