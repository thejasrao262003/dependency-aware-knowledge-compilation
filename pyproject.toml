[project]
name = "dakc"
version = "0.8.0.dev0"
description = "Incremental compiler for AI-generated knowledge: claim-level dependency tracking, selective rebuilds, and verification against full rebuilds"
dynamic = ["readme"]  # README.md with repository-relative links made absolute (see below)
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "thejasrao262003" }]
keywords = ["llm", "knowledge-base", "incremental-compilation", "build-system", "provenance", "rag", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "blake3>=1.0",
    "networkx>=3.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
watch = ["watchdog>=4"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=1.0"]
mcp = ["mcp>=2.3,<3"]
mkdocs = ["mkdocs>=1.6"]
dev = ["pytest>=8", "pymupdf>=1.24", "watchdog>=4", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=2.3,<3", "mkdocs>=1.6"]

[project.scripts]
dakc = "dakc.cli:main"

[project.entry-points."mkdocs.plugins"]
dakc = "dakc.integrations.mkdocs_plugin:DakcPlugin"

[project.urls]
Homepage = "https://github.com/thejasrao262003/dependency-aware-knowledge-compilation"
Documentation = "https://github.com/thejasrao262003/dependency-aware-knowledge-compilation#readme"
Changelog = "https://github.com/thejasrao262003/dependency-aware-knowledge-compilation/blob/main/CHANGELOG.md"
Issues = "https://github.com/thejasrao262003/dependency-aware-knowledge-compilation/issues"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# PyPI renders README.md away from the repository, so relative links would break there.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]  # images: raw files, so PyPI can display them
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/thejasrao262003/dependency-aware-knowledge-compilation/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/thejasrao262003/dependency-aware-knowledge-compilation/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/dakc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: larger benchmark-style tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
